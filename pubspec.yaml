name: meme_review
description: "Meme Arena — premium social meme battles."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1

  # State management, DI & routing
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^3.0.0
  get_it: ^9.3.0
  go_router: ^17.2.3

  # Auth
  google_sign_in: ^7.2.0

  # UI
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
